# .github/workflows/publish-mcp-registry.yml
# Publishes to the official MCP Registry whenever you push a v* tag.
# Uses GitHub OIDC, so there is no token to store — the io.github.icyn12-tinker
# namespace is authorised automatically because the workflow runs in your repo.
name: publish-mcp-registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v)"
        required: true

permissions:
  contents: read
  id-token: write        # required for OIDC auth to the registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"

      - name: Sync version fields in server.json
        run: |
          V="${{ steps.v.outputs.version }}"
          jq --arg v "$V" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Wait for the npm package to be available
        run: |
          V="${{ steps.v.outputs.version }}"
          for i in $(seq 1 30); do
            if npm view "@icyn/date-mcp@$V" version >/dev/null 2>&1; then echo "found on npm"; exit 0; fi
            echo "attempt $i: not on npm yet, sleeping"; sleep 20
          done
          echo "::error::@icyn/date-mcp@$V never appeared on npm"; exit 1

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          # Official asset name has no version in it (mcp-publisher_linux_amd64.tar.gz).
          # -f makes curl fail on a 404 instead of piping an HTML error page into tar.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version

      - name: Validate server.json against the schema
        run: |
          pipx install check-jsonschema
          check-jsonschema --schemafile "$(jq -r '."$schema"' server.json)" server.json

      # Idempotent: re-tagging or re-running a tag must not produce a false red build.
      - name: Skip if this version is already in the registry
        id: already
        run: |
          V="${{ steps.v.outputs.version }}"
          CUR=$(curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.icyn12-tinker/icyn-date" \
                | jq -r '.servers[]?.server | select(.name=="io.github.icyn12-tinker/icyn-date") | .version' | head -1)
          echo "registry has: ${CUR:-none}, publishing: $V"
          if [ "$CUR" = "$V" ]; then
            echo "::notice::$V is already published to the MCP Registry — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in with GitHub OIDC
        if: steps.already.outputs.skip != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish
        if: steps.already.outputs.skip != 'true'
        run: mcp-publisher publish
